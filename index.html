
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DATA Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              memphis: {
                pink: '#FF90E8',
                teal: '#23F0C7',
                purple: '#A388EE',
                yellow: '#FFE86C',
                beige: '#FDFBF7',
                black: '#1F2933',
              },
              terminal: {
                black: '#0a0a0a',
                dark: '#111111',
                border: '#333333',
                text: '#e5e5e5',
                dim: '#888888',
                accent: '#22c55e',
                warning: '#eab308',
                error: '#ef4444',
              }
            },
            boxShadow: {
              'memphis': '4px 4px 0px 0px #000000',
              'memphis-sm': '2px 2px 0px 0px #000000',
              'memphis-lg': '8px 8px 0px 0px #000000',
            },
            fontFamily: {
              sans: ['"Space Grotesk"', 'ui-sans-serif', 'system-ui'],
              mono: ['"Space Mono"', 'ui-monospace', 'monospace'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #FDFBF7;
        background-image: 
          linear-gradient(#E5E7EB 1px, transparent 1px),
          linear-gradient(90deg, #E5E7EB 1px, transparent 1px);
        background-size: 20px 20px;
        color: #1F2933;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #FDFBF7;
        border-left: 2px solid #000;
      }
      ::-webkit-scrollbar-thumb {
        background: #23F0C7;
        border: 2px solid #000;
        box-shadow: inset -1px -1px 0px 0px #000;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #FF90E8;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "zustand": "https://esm.sh/zustand@^5.0.9",
    "@tanstack/react-query": "https://esm.sh/@tanstack/react-query@^5.90.12",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
